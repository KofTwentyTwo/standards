# KofTwentyTwo cargo-deny configuration (K22-CODE-RS-05): advisories, licenses, bans,
# and sources. CI runs `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []   # every entry needs an issue link and an expiry date in a comment

[licenses]
version = 2
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "CC0-1.0", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
