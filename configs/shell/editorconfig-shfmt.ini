# KofTwentyTwo shfmt settings (K22-CODE-SH-02). shfmt reads .editorconfig; merge this
# section into the repository's .editorconfig. CI runs `shfmt --diff .`.
[*.{sh,bash}]
indent_style = space
# Kingsrook: 3-space indentation.
indent_size = 3
binary_next_line = true
switch_case_indent = true
space_redirects = true
function_next_line = true
