name: Standards scheduled/manual original CI
'on':
  schedule:
  - cron: 41 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: standards-scheduled-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/kof-standards-ci.yaml@kof-release-v1
    secrets:
      PUBLIC_GITHUB_AUDIT_TOKEN: ${{ secrets.PUBLIC_GITHUB_AUDIT_TOKEN }}
