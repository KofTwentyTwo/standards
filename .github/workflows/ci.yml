# CI for the standards repository itself: it runs the same reusable gates it
# publishes (called by local path, so a change is tested before it is released),
# plus documentation linting and a static self-conformance check.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr.yml
    permissions:
      contents: read
      pull-requests: read # list the pull request commits for the DCO check

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
    with:
      languages: '["actions"]'

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: docker://davidanson/markdownlint-cli2:v0.23.3@sha256:d5f3f3f04b2e285dcbcdcd13b4454d119e273e3c393a9dabd163dba4abad526d
        with:
          args: "**/*.md"

      # Offline mode checks every relative link and anchor between documents, which
      # is deterministic. External URLs are not checked on every change: third-party
      # sites rate-limit and go down, and a gate must not fail for reasons outside
      # the change under review.
      - name: Link check (internal links)
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          tool="${RUNNER_TEMP}/lychee"
          mkdir -p "${tool}"
          curl -fsSL -o "${tool}/${archive}" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}"
          (cd "${tool}" && echo "${LYCHEE_SHA256}  ${archive}" | sha256sum --check --strict)
          # The archive unpacks into a versioned directory with its own README and
          # docs; it is extracted outside the checkout so they are not link-checked.
          tar -xzf "${tool}/${archive}" -C "${tool}"
          "${tool}/lychee-x86_64-unknown-linux-gnu/lychee" --offline --include-fragments --no-progress './**/*.md'

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checker self-test
        shell: pwsh
        run: ./tools/Test-RepoConformance.ps1 -SelfTest

      # Static mode reads only the checkout: no API calls, no admin scope needed.
      - name: Static conformance of this repository
        shell: pwsh
        run: ./tools/Test-RepoConformance.ps1 -LocalPath . -StaticOnly
