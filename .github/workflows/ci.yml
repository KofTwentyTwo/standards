# CI for the standards repository itself: it runs the same reusable gates it
# publishes (called by local path, so a change is tested before it is released),
# plus documentation linting and a static self-conformance check.
name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr.yml
    permissions:
      contents: read
      pull-requests: read # list the pull request commits for the DCO check

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
    with:
      languages: '["actions"]'

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: docker://davidanson/markdownlint-cli2:v0.23.3@sha256:d5f3f3f04b2e285dcbcdcd13b4454d119e273e3c393a9dabd163dba4abad526d
        with:
          args: "**/*.md"

      # Offline mode checks every relative link and anchor between documents, which
      # is deterministic. External URLs are not checked on every change: third-party
      # sites rate-limit and go down, and a gate must not fail for reasons outside
      # the change under review.
      - name: Link check (internal links)
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          set -euo pipefail
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          tool="${RUNNER_TEMP}/lychee"
          mkdir -p "${tool}"
          curl -fsSL -o "${tool}/${archive}" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}"
          (cd "${tool}" && echo "${LYCHEE_SHA256}  ${archive}" | sha256sum --check --strict)
          # The archive unpacks into a versioned directory with its own README and
          # docs; it is extracted outside the checkout so they are not link-checked.
          tar -xzf "${tool}/${archive}" -C "${tool}"
          "${tool}/lychee-x86_64-unknown-linux-gnu/lychee" --offline --include-fragments --no-progress './**/*.md'

  conformance:
    name: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checker self-test
        shell: pwsh
        run: ./tools/Test-RepoConformance.ps1 -SelfTest

      - name: Standards package tests
        shell: pwsh
        run: ./tools/Test-StandardsPackage.ps1

      # Static mode reads only the checkout: no API calls, no admin scope needed.
      - name: Static conformance of this repository
        shell: pwsh
        run: ./tools/Test-RepoConformance.ps1 -LocalPath . -StaticOnly

  release-please:
    name: release-please
    needs: [security, codeql, docs, conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # EX-0006: a main-only bot key, never a repository secret.
    environment: release-automation
    concurrency:
      group: standards-release-pr
      cancel-in-progress: false
    permissions: {}
    steps:
      # An App token lets the generated PR trigger CI; GITHUB_TOKEN does not.
      - name: Release PR token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Version files merge before publication; wait for the publisher's label.
      - name: Check for unpublished merged releases
        id: pending
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pending="$(gh api --paginate "repos/$GH_REPO/pulls?state=closed&per_page=100" --jq '.[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending")) | .number')"
          if [[ -n "$pending" ]]; then
            echo 'can-propose=false' >> "$GITHUB_OUTPUT"
            echo "Waiting for publication of merged release PR(s): $pending"
          else
            echo 'can-propose=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Propose a semantic release
        if: steps.pending.outputs.can-propose == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
