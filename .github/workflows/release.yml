name: standards-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: standards-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-standards.yml
    # Required even when the value exists only in the called job's environment.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
      security-events: write
      id-token: write
      attestations: write
