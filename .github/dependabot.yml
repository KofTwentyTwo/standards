# Keeps every SHA-pinned action current (K22-CI-11). Container images referenced as
# `docker://image:tag@sha256:...` in workflows are reviewed by hand at each release
# of these standards; see configs/security/README.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
