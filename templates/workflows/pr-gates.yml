# Pull request gates for a KofTwentyTwo repository (K22-CI-01).
# Copy to .github/workflows/pr-gates.yml.
#
# Reusable workflows are pinned by full commit SHA like any other action
# (K22-CI-11): replace {{STANDARDS_SHA}} with the commit of the standards release
# you conform to and keep the version comment. Dependabot's github-actions
# ecosystem updates the SHA and the comment together.
name: pr-gates

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: KofTwentyTwo/standards/.github/workflows/pr.yml@{{STANDARDS_SHA}} # {{STANDARDS_VERSION}}
    permissions:
      contents: read
      pull-requests: read
