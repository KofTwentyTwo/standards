# Security scanning for a KofTwentyTwo repository (K22-CI-20, -21, -23).
# Copy to .github/workflows/security.yml. Replace {{STANDARDS_SHA}} as described in
# pr-gates.yml. Runs on every change and weekly, so advisories published against
# unchanged code still surface.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: KofTwentyTwo/standards/.github/workflows/security.yml@{{STANDARDS_SHA}} # {{STANDARDS_VERSION}}
    permissions:
      contents: read
      security-events: write
    # with:
    #   trivy-skip-dirs: tests/fixtures
